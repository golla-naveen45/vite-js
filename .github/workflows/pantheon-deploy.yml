name: Build & Deploy to Pantheon

on:
  push:
    branches:
      - vite

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install
        working-directory: web/themes/custom/mytheme

      # 4. Build Vite assets
      - name: Build assets
        run: npm run build
        working-directory: web/themes/custom/mytheme

      # 5. Setup SSH for Pantheon
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PANTHEON_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 2222 codeserver.dev.2d7e7bcd-42b3-489c-aeac-d2dd64690412.drush.in >> ~/.ssh/known_hosts

      # 6. Deploy to Pantheon
      - name: Deploy
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "github-actions"

          git remote add pantheon ${{ secrets.PANTHEON_GIT_URL }}

          git push pantheon HEAD:master --force