on:
  push:
    branches:
      - vite

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd web/themes/custom/mytheme
          npm install

      - name: Build Vite
        run: |
          cd web/themes/custom/mytheme
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PANTHEON_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 2222 codeserver.dev.2d7e7bcd-42b3-489c-aeac-d2dd64690412.drush.in >> ~/.ssh/known_hosts

      - name: Add Pantheon remote
        run: |
          git remote add pantheon ssh://codeserver.dev.2d7e7bcd-42b3-489c-aeac-d2dd64690412@codeserver.dev.2d7e7bcd-42b3-489c-aeac-d2dd64690412.drush.in:2222/~/repository.git

      - name: Commit build artifacts
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@example.com"
          git add web/themes/custom/mytheme/dist
          git commit -m "Build assets" || echo "No changes"

      - name: Push to Pantheon
        run: |
          git push pantheon HEAD:master