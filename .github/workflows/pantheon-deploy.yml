name: Build & Deploy to Pantheon

on:
  push:
    branches:
      - vite

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node (use 20 for Vite stability)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: web/themes/custom/mytheme
        run: npm install

      # 4. Build Vite
      - name: Build assets
        working-directory: web/themes/custom/mytheme
        run: npm run build

      # 5. Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PANTHEON_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 2222 codeserver.dev.2d7e7bcd-42b3-489c-aeac-d2dd64690412.drush.in >> ~/.ssh/known_hosts

      # 6. Deploy to Pantheon
      - name: Deploy
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@example.com"

          # Remove existing remote (safe)
          git remote remove pantheon || true

          # Correct Pantheon git URL (IMPORTANT)
          git remote add pantheon ssh://codeserver.dev.2d7e7bcd-42b3-489c-aeac-d2dd64690412.drush.in:2222/~/repository.git

          # Add built files
          git add web/themes/custom/mytheme/dist

          git commit -m "Build assets" || echo "No changes to commit"

          # Force push (required)
          git push pantheon HEAD:master --force