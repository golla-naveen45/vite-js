name: Vite Build

on:
  push:
    branches:
      - vite

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web/themes/custom/mytheme

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # 🔍 Debug (fixed indentation)
      - name: Debug dist folder
        run: |
          ls -R dist

      # ✅ Upload CSS
      - name: Upload CSS
        uses: actions/upload-artifact@v4
        with:
          name: compiled-css
          path: web/themes/custom/mytheme/dist/css/*.css